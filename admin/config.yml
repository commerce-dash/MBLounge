backend:
  name: github
  repo: commerce-dash/MBLounge
  branch: main
  auth_methods:
    - token
  commit_messages:
    create: 'CMS: create {{collection}} “{{slug}}”'
    update: 'CMS: update {{collection}} “{{slug}}”'
    delete: 'CMS: delete {{collection}} “{{slug}}”'

site_url: https://commerce-dash.github.io/MBLounge
display_url: https://commerce-dash.github.io/MBLounge
media_folder: assets/uploads
public_folder: /MBLounge/assets/uploads
publish_mode: simple
show_preview_links: false

collections:
  - name: site
    label: Site & Homepage
    description: Edit site-wide settings and arrange page sections. Changes commit to GitHub and publish through Pages.
    files:
      - name: site
        label: Site content
        file: content/site.json
        format: json
        fields:
          - name: siteName
            label: Site name
            widget: string
          - name: brand
            label: Brand identity
            widget: object
            fields:
              - { name: logo, label: Main logo, widget: image, required: false }
              - { name: primaryColor, label: Primary color, widget: color }
              - { name: accentColor, label: Accent color, widget: color }
              - { name: highlightColor, label: Highlight color, widget: color }
              - { name: surfaceColor, label: Surface color, widget: color }
              - { name: textColor, label: Text color, widget: color }
          - name: typography
            label: Typography
            widget: object
            fields:
              - name: headingFont
                label: Heading font
                widget: select
                options: ['Playfair Display', Georgia, Arial, system-ui]
              - name: bodyFont
                label: Body font
                widget: select
                options: ['DM Sans', Arial, Georgia, system-ui]
              - { name: headingFontFile, label: Custom heading font file, widget: file, required: false }
              - { name: bodyFontFile, label: Custom body font file, widget: file, required: false }
          - name: layout
            label: Layout
            widget: object
            fields:
              - name: contentWidth
                label: Content width
                widget: select
                options: [{ label: Standard, value: standard }, { label: Compact, value: compact }, { label: Wide, value: wide }]
              - name: sectionSpacing
                label: Section spacing
                widget: select
                options: [{ label: Standard, value: standard }, { label: Compact, value: compact }, { label: Spacious, value: spacious }]
              - { name: roundedCorners, label: Rounded corners, widget: boolean, required: false }
          - name: marketing
            label: Marketing & announcements
            widget: object
            fields:
              - { name: announcementEnabled, label: Show announcement bar, widget: boolean }
              - { name: announcementText, label: Announcement, widget: string }
              - { name: defaultShareDescription, label: Default search/share description, widget: text }
          - name: navigation
            label: Navigation links
            widget: list
            label_singular: Navigation link
            fields:
              - { name: label, label: Link text, widget: string }
              - { name: url, label: Link destination, widget: string }
              - { name: openInNewTab, label: Open in new tab, widget: boolean, required: false }
          - name: events
            label: Upcoming events
            widget: list
            label_singular: Event
            summary: '{{title}}'
            fields:
              - { name: title, label: Event name, widget: string }
              - { name: startsAt, label: Date and time, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ' }
              - { name: eventType, label: Category, widget: string, default: Special event }
              - { name: summary, label: Description, widget: text }
              - { name: priceLabel, label: Admission note, widget: string, required: false }
              - { name: ticketUrl, label: Event or ticket link, widget: string, required: false }
              - { name: featured, label: Highlight this event, widget: boolean, required: false }
              - { name: published, label: Show on site, widget: boolean }
          - name: homepage
            label: Homepage
            widget: object
            fields:
              - name: seo
                label: Search and social preview
                widget: object
                fields:
                  - { name: title, label: Page title, widget: string }
                  - { name: description, label: Description, widget: text }
                  - { name: shareImage, label: Social share image, widget: image, required: false }
              - name: sections
                label: Page sections
                label_singular: Section
                widget: list
                summary: '{{type}} — {{heading}} {{accentHeading}}'
                types:
                  - name: hero
                    label: Hero
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string }
                      - { name: heading, label: Heading, widget: string }
                      - { name: accentHeading, label: Accent line, widget: string }
                      - { name: body, label: Introduction, widget: text }
                      - name: primaryAction
                        label: Main button
                        widget: object
                        fields: [{ name: label, label: Text, widget: string }, { name: url, label: Link, widget: string }]
                      - name: secondaryAction
                        label: Second button
                        widget: object
                        fields: [{ name: label, label: Text, widget: string }, { name: url, label: Link, widget: string }]
                      - name: slides
                        label: Background slideshow images
                        widget: list
                        fields: [{ name: image, label: Image, widget: image }, { name: altText, label: Accessibility description, widget: string }]
                      - { name: slideDuration, label: Time per image in milliseconds, widget: number, value_type: int }
                      - { name: transitionDuration, label: Fade duration in milliseconds, widget: number, value_type: int }
                      - { name: transition, label: Transition, widget: select, options: [fade, cut] }
                  - name: event-list
                    label: Event listing
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string }
                      - { name: heading, label: Heading, widget: string }
                      - { name: accentHeading, label: Accent line, widget: string }
                      - { name: intro, label: Event note, widget: string }
                      - { name: allEventsUrl, label: All events link, widget: string }
                      - { name: maxEvents, label: Maximum events shown, widget: number, value_type: int }
                  - name: story
                    label: Our story
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string }
                      - { name: heading, label: Heading, widget: string }
                      - { name: accentHeading, label: Accent line, widget: string }
                      - { name: body, label: Story text, widget: text }
                      - { name: image, label: Photo, widget: image, required: false }
                      - { name: imageAlt, label: Photo description, widget: string, required: false }
                      - { name: statValue, label: Year/statistic, widget: string }
                      - { name: statLabel, label: Statistic caption, widget: string }
                  - name: private-events
                    label: Private events
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string }
                      - { name: heading, label: Heading, widget: string }
                      - { name: accentHeading, label: Accent line, widget: string }
                      - { name: body, label: Description, widget: text }
                      - { name: image, label: Photo, widget: image, required: false }
                      - { name: imageAlt, label: Photo description, widget: string, required: false }
                      - name: action
                        label: Button
                        widget: object
                        fields: [{ name: label, label: Text, widget: string }, { name: url, label: Link, widget: string }]
                  - name: community
                    label: Community
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string }
                      - { name: heading, label: Heading, widget: string }
                      - { name: accentHeading, label: Accent line, widget: string }
                      - { name: body, label: Description, widget: text }
                      - name: action
                        label: Button
                        widget: object
                        fields: [{ name: label, label: Text, widget: string }, { name: url, label: Link, widget: string }]
                  - name: live-video
                    label: Live video feed
                    fields:
                      - { name: enabled, label: Show live feed, widget: boolean }
                      - { name: title, label: Section title, widget: string }
                      - { name: caption, label: Description, widget: string }
                      - { name: provider, label: Video provider, widget: select, options: [{ label: RTSP.me, value: rtsp-me }, { label: YouTube, value: youtube }, { label: Vimeo, value: vimeo }] }
                      - { name: embedUrl, label: Embed URL, widget: string }
                      - { name: poster, label: Poster image, widget: image, required: false }
                      - { name: aspectRatio, label: Aspect ratio, widget: select, options: ['16:9', '4:3', '1:1'] }
                  - name: promo-banner
                    label: Marketing banner
                    fields:
                      - { name: enabled, label: Show banner, widget: boolean }
                      - { name: eyebrow, label: Eyebrow, widget: string }
                      - { name: heading, label: Heading, widget: string }
                      - { name: body, label: Description, widget: text }
                      - { name: image, label: Background image, widget: image, required: false }
                      - name: action
                        label: Button
                        widget: object
                        fields: [{ name: label, label: Text, widget: string }, { name: url, label: Link, widget: string }]
                  - name: rich-text
                    label: Text section
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string, required: false }
                      - { name: heading, label: Heading, widget: string, required: false }
                      - { name: body, label: Text, widget: text }
                  - name: photo-gallery
                    label: Photo gallery
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string, required: false }
                      - { name: heading, label: Heading, widget: string, required: false }
                      - name: images
                        label: Photos
                        widget: list
                        fields: [{ name: image, label: Photo, widget: image }, { name: altText, label: Photo description, widget: string, required: false }]
                  - name: logo-grid
                    label: Community logos (grid)
                    fields:
                      - { name: eyebrow, label: Eyebrow, widget: string, required: false }
                      - { name: heading, label: Heading, widget: string }
                      - name: logos
                        label: Logos
                        widget: list
                        fields: [{ name: name, label: Organization name, widget: string }, { name: logo, label: Logo image, widget: image }, { name: url, label: Website, widget: string, required: false }]
                  - name: logo-ticker
                    label: Scrolling logo ticker
                    fields:
                      - { name: enabled, label: Show ticker, widget: boolean }
                      - { name: heading, label: Accessible section label, widget: string }
                      - name: logos
                        label: Logo links
                        label_singular: Logo
                        widget: list
                        summary: '{{name}}'
                        fields:
                          - { name: name, label: Organization name, widget: string }
                          - { name: logo, label: Upload logo image, widget: image }
                          - { name: altText, label: Image description, widget: string, required: false }
                          - { name: url, label: Link destination, widget: string, required: false }
                          - { name: openInNewTab, label: Open link in a new tab, widget: boolean, required: false }
                      - { name: animation, label: Animate scrolling, widget: boolean }
                      - { name: direction, label: Scroll direction, widget: select, options: [{ label: Left, value: left }, { label: Right, value: right }] }
                      - { name: durationSeconds, label: Seconds per loop (12–120), widget: number, value_type: int }
                      - { name: gapPixels, label: Space between logos (18–96 px), widget: number, value_type: int }
                      - { name: effect, label: Logo effect, widget: select, options: [{ label: None, value: none }, { label: Gentle float, value: float }] }
                      - { name: pauseOnHover, label: Pause while hovered or focused, widget: boolean }
